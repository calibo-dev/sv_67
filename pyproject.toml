[project]
name = "latest_ai_development"
version = "0.1.0"
description = "latest-ai-development using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler>=3.11.2",
    "anthropic>=0.109.1",
    "azure-identity>=1.25.1",
    "azure-keyvault-secrets>=4.10.0",
    "boto3>=1.42.47",
    "crewai[azure-ai-inference,google-genai,tools]==1.10.1",
    "dotenv>=0.9.9",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "fastapi-sso>=0.17.0",
    "langsmith>=0.8.5",
    "litellm>=1.75.3",
    "openinference-instrumentation-crewai>=1.1.7",
    "openinference-instrumentation-openai>=0.1.49",
    "openai>=1.108.1",
    "pandas>=2.3.3",
    "pydantic>=2.11.10",
    "snowflake-connector-python[pandas]>=4.0.0",
    "uvicorn>=0.40.0",
    "google-genai>=1.49.0",
    "openinference-instrumentation-anthropic>=1.0.6",
    "openinference-instrumentation-google-genai>=1.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
latest_ai_development = "latest_ai_development.main:run"
run_crew = "latest_ai_development.main:run"
train = "latest_ai_development.main:train"
replay = "latest_ai_development.main:replay"
test = "latest_ai_development.main:test"
run_with_trigger = "latest_ai_development.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latest_ai_development"]

[tool.pytest.ini_options]
addopts = "--cov=latest_ai_development --cov-report=xml:coverage.xml --junitxml=testreport.xml"
testpaths = ["tests"]

[tool.crewai]
type = "crew"
